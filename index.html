<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analizador de movimientos bancarios</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#faf6f2;--card:#fff;--ink:#1a1411;--mut:#7a6d64;--line:#eee4dc;--inc:#0f9d68;--exp:#d92d20;--acc:#ee5f17;--at:#fff0e6;--red:#e1251b;--nav:#17120f;--sh:0 1px 2px rgba(60,30,10,.05),0 10px 28px -14px rgba(60,30,10,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d0a;--card:#1d1613;--ink:#f6efe9;--mut:#a89a90;--line:#34281f;--inc:#3ecf8e;--exp:#ff6b5e;--acc:#ff7a33;--at:#3a1f12;--sh:none}}
:root[data-theme="dark"]{--bg:#120d0a;--card:#1d1613;--ink:#f6efe9;--mut:#a89a90;--line:#34281f;--inc:#3ecf8e;--exp:#ff6b5e;--acc:#ff7a33;--at:#3a1f12;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Manrope,system-ui,sans-serif}
h1{font-size:30px;font-weight:800;letter-spacing:-.025em;margin:0 0 2px}h3{margin:0 0 12px;font-size:15px;font-weight:800}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--nav);padding:24px 14px;position:sticky;top:0;height:100vh;align-self:start}
.brand{text-align:center;color:#f6efe9;font-weight:800;font-size:15px;line-height:1.2;padding:0 6px 24px}
.brand img{display:block;width:132px;height:132px;margin:0 auto 12px;filter:drop-shadow(0 8px 18px rgba(238,95,23,.35))}
.b{display:block;width:100%;text-align:left;padding:11px 16px;margin-bottom:4px;border:0;background:none;color:#d6cbc2;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;transition:background .15s}
.b:hover{background:rgba(255,255,255,.08)}.b.on{background:var(--acc);color:#fff}
main{padding:28px 32px;min-width:0}
.top{display:none;align-items:center;gap:10px;font-weight:800;margin-bottom:14px}.top img{width:44px;height:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#fb{margin:16px 0;display:grid;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:16px 0}
.k small{color:var(--mut);font-weight:600}.k b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.hero{background:linear-gradient(135deg,var(--red),var(--acc));border:0;color:#fff}.hero small{color:rgba(255,255,255,.85)}.hero b{font-size:30px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.ch{position:relative;height:280px}.ch.big{height:370px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:700;cursor:pointer}.r{text-align:right}.wrap{overflow-x:auto}
tbody tr:hover{background:var(--at)}tbody tr[data-k]{cursor:pointer}
input,select,.s{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.s{cursor:pointer;border-radius:999px;font-weight:600}.s:hover{border-color:var(--acc);color:var(--acc)}
.pri{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;display:inline-block;box-shadow:0 6px 16px -6px var(--acc)}
.pri:hover{filter:brightness(1.08)}.pri:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.inc{color:var(--inc)}.exp{color:var(--exp)}.mut{color:var(--mut)}
.badge{background:var(--at);color:var(--acc);border-radius:999px;padding:4px 12px;font-weight:700}
.drop{display:block;border:2px dashed var(--line);border-radius:24px;padding:48px 16px;text-align:center;cursor:pointer;margin:16px 0;background:var(--card)}
.drop.over,.drop:focus-within,.drop:hover{border-color:var(--acc);background:var(--at)}
.sr{position:absolute;opacity:0;width:1px;height:1px}
.tp{display:grid;grid-template-columns:1fr 120px 90px;gap:8px;align-items:center;padding:6px 0}
.tp i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--red))}
.gap>*{margin-top:14px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;display:flex;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}.brand{display:none}.top{display:flex}.b{text-align:center;padding:9px 2px;font-size:11px;margin:0;border-radius:14px}main{padding:16px 14px 96px}h1{font-size:24px}.tp{grid-template-columns:1fr 80px}.tp i{display:none}}
</style></head><body>

<script>
const $=s=>document.querySelector(s),eur=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}),f=n=>eur.format(n);
const norm=s=>String(s==null?'':s).replace(/\s+/g,' ').trim(),fold=s=>norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0),p2=n=>String(n).padStart(2,'0'),fd=d=>d?d.split('-').reverse().join('/'):'';
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],TIME=['day','week','month','quarter','year'];
const PAL=['#ee5f17','#e1251b','#1a1411','#f7a541','#0f9d68','#8a7a6e','#b4410c','#fbc02d','#57534e','#0f766e'];
const OPS=[['has','contiene'],['nhas','no contiene'],['starts','empieza por'],['ends','termina por'],['eq','igual a'],['neq','distinto de']];
let T=[],rows=[],view='imp',review=[],SUG=[],groups=[],CH={};
let F={from:'',to:'',type:'all',join:'AND',rules:[{op:'has',v:''}]},C={metric:'both',by:'month',type:'bar',neg:false},sort={k:'date',d:-1},CQ={q:'',by:'concept',o:'exp'};
let imp={map:{},hdr:0,done:null,err:'',wb:null};
try{groups=JSON.parse(localStorage.getItem('grp')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('grp',JSON.stringify(groups))}catch(e){}};
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- Importación ---------- */
function readFile(file){if(!file)return;const r=new FileReader();r.onload=e=>{try{imp.wb=XLSX.read(e.target.result,{type:'array'});imp.name=file.name;imp.sheet=imp.wb.SheetNames.includes('Listado')?'Listado':imp.wb.SheetNames[0];imp.done=null;imp.err='';loadSheet()}catch(x){imp.wb=null;imp.err='No se pudo leer el fichero: '+x.message}render()};r.readAsArrayBuffer(file)}
function loadSheet(){rows=XLSX.utils.sheet_to_json(imp.wb.Sheets[imp.sheet],{header:1,raw:true,defval:''});const re=/fecha|concepto|importe|saldo|descrip|amount|date/i;let best=0,bi=0;rows.slice(0,40).forEach((r,i)=>{const n=r.filter(c=>typeof c==='string'&&re.test(c)).length;if(n>best){best=n;bi=i}});imp.hdr=bi;autoMap()}
function autoMap(){const h=(rows[imp.hdr]||[]).map(c=>fold(c).toLowerCase()),fi=(re,ex)=>{const i=h.findIndex(x=>re.test(x)&&!(ex&&ex.test(x)));return i<0?'':i};
 imp.map={date:fi(/fecha|date/,/valor/),vdate:fi(/valor/),concept:fi(/concepto|descrip|detalle|movimiento/),amount:fi(/importe|cantidad|amount/),balance:fi(/saldo|balance/)}}
function valid(y,m,d){const t=new Date(Date.UTC(y,m-1,d));return t.getUTCMonth()===m-1&&t.getUTCDate()===d?`${y}-${p2(m)}-${p2(d)}`:null}
function pd(v){if(v===''||v==null)return null;if(typeof v==='number'){const o=XLSX.SSF.parse_date_code(v);return o?valid(o.y,o.m,o.d):null}
 const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return valid(y,+m[2],+m[1])}
 m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?valid(+m[1],+m[2],+m[3]):null}
function pn(v){if(typeof v==='number')return v;if(v===''||v==null)return null;let s=String(v).replace(/[€\s]|EUR/gi,'');if(!/^[-+]?[\d.,]+$/.test(s))return null;
 const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');if(lc>-1&&ld>-1)s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(lc>-1)s=s.replace(',','.');else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
 const n=parseFloat(s);return isNaN(n)?null:n}
function build(){const m=imp.map;if(m.date===''||m.amount==='')return;T=[];review=[];
 rows.slice(imp.hdr+1).forEach((r,i)=>{if(r.every(c=>c===''))return;const row=imp.hdr+i+2,d=pd(r[m.date]),a=pn(r[m.amount]);
  if(d==null||a==null){if(r[m.date]===''&&r[m.amount]==='')return;review.push({row,why:d==null?'Fecha no válida':'Importe no numérico',txt:r.filter(c=>c!=='').join(' | ')});return}
  const c=m.concept===''?'':r[m.concept];
  T.push({id:T.length+1,date:d,valueDate:m.vdate===''?null:pd(r[m.vdate]),concept:String(c),normalizedConcept:norm(c),f:fold(c),amount:a,balance:m.balance===''?null:pn(r[m.balance]),type:a>0?'income':a<0?'expense':'neutral',originalRow:row})});
 T.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);assign();imp.done={ok:T.length,rev:review};clearF(true);render()}

/* ---------- Grupos y filtros ---------- */
function groupOf(t){for(const g of groups)if(g.terms.some(x=>t.f.includes(fold(x))))return g.name;return 'Sin grupo'}
function assign(){T.forEach(t=>t.category=groupOf(t))}
function match(s,op,v){v=fold(v);switch(op){case'has':return s.includes(v);case'nhas':return !s.includes(v);case'starts':return s.startsWith(v);case'ends':return s.endsWith(v);case'eq':return s===v;case'neq':return s!==v}}
function filtered(){const R=F.rules.filter(r=>fold(r.v));return T.filter(t=>(!F.from||t.date>=F.from)&&(!F.to||t.date<=F.to)&&(F.type==='all'||t.type===F.type)&&(!R.length||(F.join==='AND'?R.every(r=>match(t.f,r.op,r.v)):R.some(r=>match(t.f,r.op,r.v)))))}
function clearF(silent){F={from:'',to:'',type:'all',join:'AND',rules:[{op:'has',v:''}]};syncFB();$('#pre').value='all';if(!silent)refresh()}
function preset(p){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate(),I=x=>x.toISOString().slice(0,10),U=(a,b,c)=>new Date(Date.UTC(a,b,c));let a='',b='';
 if(p==='tm'){a=I(U(y,m,1));b=I(U(y,m+1,0))}else if(p==='lm'){a=I(U(y,m-1,1));b=I(U(y,m,0))}else if(p==='30'){a=I(U(y,m,d-29));b=I(U(y,m,d))}else if(p==='90'){a=I(U(y,m,d-89));b=I(U(y,m,d))}else if(p==='ty'){a=y+'-01-01';b=y+'-12-31'}else if(p==='ly'){a=(y-1)+'-01-01';b=(y-1)+'-12-31'}
 F.from=a;F.to=b;syncFB();refresh()}
function syncFB(){$('#jn').textContent=F.join==='AND'?'Y':'O';$('#fd').value=F.from;$('#ft').value=F.to;$('#ftype').value=F.type;
 $('#rl').innerHTML=F.rules.map((r,i)=>`<span class="row"><select onchange="F.rules[${i}].op=this.value;refresh()" aria-label="Operador">${OPS.map(([a,b])=>`<option value="${a}"${a===r.op?' selected':''}>${b}</option>`).join('')}</select><input value="${esc(r.v)}" placeholder="texto del concepto" oninput="F.rules[${i}].v=this.value;refresh()"><button class="s" onclick="F.rules.splice(${i},1);syncFB();refresh()" aria-label="Quitar filtro">✕</button></span>`).join('')}
function refresh(){$('#fc').textContent=filtered().length+' de '+T.length+' movimientos';render()}

/* ---------- Agregación ---------- */
const wk=d=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-(t.getUTCDay()+6)%7);return t.toISOString().slice(0,10)};
function key(t,by){const d=t.date;switch(by){case'day':return d;case'week':return wk(d);case'month':return d.slice(0,7);case'quarter':return d.slice(0,4)+'-T'+Math.ceil(+d.slice(5,7)/3);case'year':return d.slice(0,4);case'concept':return t.normalizedConcept||'(sin concepto)';case'group':return t.category;case'type':return{income:'Ingresos',expense:'Gastos',neutral:'Neutros'}[t.type]}}
function label(k,by){if(by==='month'){const[y,m]=k.split('-');return MES[m-1]+' '+y}if(by==='week')return 'Sem '+k.slice(8)+'/'+k.slice(5,7);if(by==='day')return k.slice(8)+'/'+k.slice(5,7)+'/'+k.slice(2,4);return k}
function agg(R,by){const m=new Map();R.forEach(t=>{const k=key(t,by);let e=m.get(k);if(!e)m.set(k,e={k,inc:0,exp:0,n:0,sal:null});if(t.amount>0)e.inc+=t.amount;else e.exp-=t.amount;e.n++;if(t.balance!=null)e.sal=t.balance});
 return[...m.values()].sort(TIME.includes(by)?(x,y)=>x.k<y.k?-1:1:(x,y)=>(y.inc+y.exp)-(x.inc+x.exp))}

/* ---------- Gráficos ---------- */
function mk(id,cfg){const el=document.getElementById(id);if(!el)return;Chart.defaults.color=cv('--mut');Chart.defaults.borderColor=cv('--line');Chart.defaults.font.family='Manrope,system-ui,sans-serif';if(CH[id])CH[id].destroy();CH[id]=new Chart(el,cfg)}
function opt(pie,fm=f){const o={maintainAspectRatio:false,plugins:{legend:{display:!!pie,position:'bottom'},tooltip:{callbacks:{label:c=>' '+(c.dataset.label?c.dataset.label+': ':'')+fm(c.parsed.y??c.parsed)}}}};if(!pie)o.scales={x:{grid:{display:false}},y:{ticks:{callback:v=>Math.abs(v)>=1000?v/1000+'k':v}}};return o}
function drawMain(){if(!$('#c0'))return;let a=agg(filtered(),C.by);if(!TIME.includes(C.by))a=a.slice(0,15);
 const sg=C.neg?-1:1,L=a.map(e=>label(e.k,C.by)),S={inc:['Ingresos',a.map(e=>e.inc),'--inc'],exp:['Gastos',a.map(e=>e.exp*sg),'--exp'],bal:['Balance',a.map(e=>e.inc-e.exp),'--acc'],n:['Movimientos',a.map(e=>e.n),'--acc'],sal:['Saldo',a.map(e=>e.sal),'--acc']},
 M={income:['inc'],expense:['exp'],balance:['bal'],both:['inc','exp'],count:['n'],saldo:['sal']}[C.metric],fm=C.metric==='count'?(n=>n):f,ty=C.type,pie=ty==='pie'||ty==='doughnut';let cfg;
 if(pie){const k=C.metric==='both'?'exp':M[0];cfg={type:ty,data:{labels:L,datasets:[{label:S[k][0],data:S[k][1].map(Math.abs),backgroundColor:PAL}]},options:opt(true,fm)}}
 else{const bar=['bar','stack','combo'].includes(ty),ds=M.map(k=>{const c=cv(S[k][2]);return{label:S[k][0],data:S[k][1],backgroundColor:ty==='area'?c+'33':c,borderColor:c,fill:ty==='area',tension:.25,pointRadius:a.length>40?0:3,type:bar?'bar':'line'}});
  if(ty==='combo'&&!M.includes('bal'))ds.push({label:'Balance',type:'line',data:S.bal[1],borderColor:cv('--ink'),backgroundColor:cv('--ink'),tension:.25});
  const o=opt(false,fm);if(ty==='stack'){o.scales.x.stacked=true;o.scales.y.stacked=true}cfg={type:bar?'bar':'line',data:{labels:L,datasets:ds},options:o}}
 mk('c0',cfg)}
function draw2(){const R=filtered(),by=groups.length?'group':'concept',ex=agg(R.filter(t=>t.amount<0),by).slice(0,8),s=R.filter(t=>t.balance!=null),m=agg(R,'month');
 mk('c1',{type:'doughnut',data:{labels:ex.map(e=>e.k),datasets:[{data:ex.map(e=>e.exp),backgroundColor:PAL}]},options:opt(true)});
 mk('c2',{type:'line',data:{labels:s.map(t=>label(t.date,'day')),datasets:[{label:'Saldo',data:s.map(t=>t.balance),borderColor:cv('--acc'),pointRadius:0,stepped:true}]},options:opt()});
 mk('c3',{type:'bar',data:{labels:m.map(e=>label(e.k,'month')),datasets:[{label:'Movimientos',data:m.map(e=>e.n),backgroundColor:cv('--acc')}]},options:opt(false,n=>n)})}

/* ---------- Vistas ---------- */
const AFTER={dash(){drawMain();draw2()},conc(){concBody()},imp(){const d=$('#dz');if(!d)return;d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');readFile(e.dataTransfer.files[0])}}};
const V={dash,mov,conc,grp,imp:impView};
function go(v){view=v;render()}
function render(){document.querySelectorAll('.b').forEach(b=>b.classList.toggle('on',b.dataset.v===view));$('#fb').hidden=view==='imp'||!T.length;
 if(view!=='imp'&&!T.length){$('#view').innerHTML='<div class="card"><h1>Aún no hay datos</h1><p class="mut">Importa un Excel con tus movimientos para empezar.</p><button class="pri" onclick="go(\'imp\')">Importar Excel</button></div>';return}
 $('#view').innerHTML=V[view]();AFTER[view]&&AFTER[view]();if(T.length)$('#fc').textContent=filtered().length+' de '+T.length+' movimientos'}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('.b');if(b)go(b.dataset.v)};
function dash(){const R=filtered(),inc=sum(R,t=>t.amount>0?t.amount:0),exp=sum(R,t=>t.amount<0?-t.amount:0),last=[...R].reverse().find(t=>t.balance!=null),
 K=(l,v,c='',x='')=>`<div class="card k ${x}"><small>${l}</small><b class="${c}">${v}</b></div>`,
 sel=(id,o)=>`<select aria-label="${id}" onchange="C.${id}=this.value;drawMain()">${o.map(([a,b])=>`<option value="${a}"${a==C[id]?' selected':''}>${b}</option>`).join('')}</select>`,
 top=agg(R,'concept').slice(0,8),mx=Math.max(1,...top.map(e=>e.inc+e.exp));
 return`<h1>Tus cuentas, claras</h1><p class="mut">Resumen según los filtros activos</p><div class="kpis">${K('Ingresos totales',f(inc),'inc')+K('Gastos totales',f(exp),'exp')+K('Balance',f(inc-exp),'','hero')+K('Movimientos',R.length)+K('Saldo actual',last?f(last.balance):'—')}</div>
 <div class="card"><div class="row" style="margin-bottom:10px">${sel('metric',[['both','Ingresos y gastos'],['income','Ingresos'],['expense','Gastos'],['balance','Balance'],['count','Nº de movimientos'],['saldo','Saldo']])}${sel('by',[['month','por mes'],['day','por día'],['week','por semana'],['quarter','por trimestre'],['year','por año'],['concept','por concepto'],['group','por grupo'],['type','por tipo']])}${sel('type',[['bar','Barras'],['stack','Barras apiladas'],['line','Línea'],['area','Área'],['doughnut','Dona'],['pie','Circular'],['combo','Combinado']])}<label><input type="checkbox" ${C.neg?'checked':''} onchange="C.neg=this.checked;drawMain()"> Gastos en negativo</label></div><div class="ch big"><canvas id="c0"></canvas></div></div>
 <div class="g2"><div class="card"><h3>Distribución de gastos</h3><div class="ch"><canvas id="c1"></canvas></div></div><div class="card"><h3>Evolución del saldo</h3><div class="ch"><canvas id="c2"></canvas></div></div><div class="card"><h3>Movimientos por mes</h3><div class="ch"><canvas id="c3"></canvas></div></div>
 <div class="card"><h3>Top conceptos</h3>${top.map(e=>`<div class="tp"><span style="overflow:hidden;text-overflow:ellipsis">${esc(e.k)}</span><i style="width:${(e.inc+e.exp)/mx*100}%"></i><span class="r ${e.inc>=e.exp?'inc':'exp'}">${f(e.inc-e.exp)}</span></div>`).join('')}</div></div>`}
function srt(k){sort={k,d:sort.k===k?-sort.d:1};render()}
function mov(){const R=filtered().sort((a,b)=>{const x=a[sort.k]??'',y=b[sort.k]??'';return(x>y?1:x<y?-1:0)*sort.d}),H=[['date','Fecha'],['concept','Concepto'],['valueDate','Fecha valor'],['type','Tipo'],['amount','Importe'],['balance','Saldo'],['category','Grupo']],TL={income:'Ingreso',expense:'Gasto',neutral:'Neutro'};
 return`<h1>Movimientos</h1><p class="mut">${R.length} movimientos${R.length>1000?' (se muestran los primeros 1000)':''}</p><div class="card wrap"><table><thead><tr>${H.map(([k,l])=>`<th class="${k==='amount'||k==='balance'?'r':''}" onclick="srt('${k}')">${l}${sort.k===k?(sort.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${R.slice(0,1000).map(t=>`<tr><td>${fd(t.date)}</td><td title="${esc(t.concept)}">${esc(t.normalizedConcept)}</td><td>${fd(t.valueDate)}</td><td><span class="${t.type==='income'?'inc':t.type==='expense'?'exp':'mut'}">${TL[t.type]}</span></td><td class="r ${t.amount>0?'inc':t.amount<0?'exp':''}">${f(t.amount)}</td><td class="r">${t.balance==null?'':f(t.balance)}</td><td>${esc(t.category)}</td></tr>`).join('')}</tbody></table></div>`}
function conc(){return`<h1>Conceptos</h1><div class="row" style="margin:10px 0"><input placeholder="Buscar concepto" value="${esc(CQ.q)}" oninput="CQ.q=this.value;concBody()"><select onchange="CQ.by=this.value;render()"><option value="concept"${CQ.by==='concept'?' selected':''}>Por concepto</option><option value="group"${CQ.by==='group'?' selected':''}>Por grupo</option></select><select onchange="CQ.o=this.value;concBody()">${[['exp','Mayor gasto'],['inc','Mayor ingreso'],['n','Más movimientos'],['bal','Mayor balance'],['name','Nombre']].map(([a,b])=>`<option value="${a}"${CQ.o===a?' selected':''}>${b}</option>`).join('')}</select></div><p class="mut">Pulsa una fila para ver sus movimientos.</p><div class="card wrap"><table><thead><tr><th>${CQ.by==='group'?'Grupo':'Concepto'}</th><th class="r">Movimientos</th><th class="r">Ingresos</th><th class="r">Gastos</th><th class="r">Balance</th><th class="r">%</th></tr></thead><tbody id="cb"></tbody></table></div>`}
function concBody(){const a=agg(filtered(),CQ.by),tot=sum(a,e=>e.inc+e.exp)||1,q=fold(CQ.q),L=a.filter(e=>!q||fold(e.k).includes(q));
 L.sort({exp:(x,y)=>y.exp-x.exp,inc:(x,y)=>y.inc-x.inc,n:(x,y)=>y.n-x.n,bal:(x,y)=>(y.inc-y.exp)-(x.inc-x.exp),name:(x,y)=>x.k.localeCompare(y.k)}[CQ.o]);
 $('#cb').innerHTML=L.map(e=>`<tr data-k="${esc(e.k)}"><td>${esc(e.k)}</td><td class="r">${e.n}</td><td class="r inc">${f(e.inc)}</td><td class="r exp">${f(e.exp)}</td><td class="r">${f(e.inc-e.exp)}</td><td class="r">${((e.inc+e.exp)/tot*100).toFixed(1)}%</td></tr>`).join('');
 $('#cb').onclick=ev=>{const tr=ev.target.closest('tr');if(!tr)return;const k=tr.dataset.k;
  if(CQ.by==='concept'){F.rules=[{op:'eq',v:k}];F.join='AND'}else{const g=groups.find(g=>g.name===k);if(!g)return;F.rules=g.terms.map(v=>({op:'has',v}));F.join='OR'}syncFB();view='mov';refresh()}}
function addG(){const n=norm($('#gn').value),t=$('#gt').value.split(',').map(norm).filter(Boolean);if(!n||!t.length||groups.some(g=>g.name===n))return;groups.push({name:n,terms:t});save();assign();render()}
function act(a,i){if(a==='del')groups.splice(i,1);if(a==='acc'){const s=SUG.splice(i,1)[0];if(!groups.some(g=>g.name===s.name))groups.push({name:s.name,terms:[s.term]})}if(a==='rej')SUG.splice(i,1);save();assign();render()}
function suggest(){const STOP=new Set(['TRANSF','OP.NET','RECIBO','ABONO','PAGO','COMPRA','TRASPASO','LIQ','INT']),m=new Map();
 T.forEach(t=>{const w=t.f.split(' ').map(x=>x.replace(/^\.+|\.+$/g,'')).filter(x=>x.length>2&&!/\d/.test(x)&&!STOP.has(x)).slice(0,2).join(' ');if(w)m.set(w,(m.get(w)||0)+1)});
 const cov=w=>groups.some(g=>g.terms.some(x=>fold(x)===w));
 SUG=[...m].filter(([w,n])=>n>=2&&!cov(w)).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([w,n])=>({term:w,name:w.toLowerCase().replace(/(^| )\S/g,c=>c.toUpperCase()),n}));if(!SUG.length)SUG=[{none:1}];render()}
function grp(){const R=filtered(),a=agg(R,'group'),tot=sum(a,e=>e.inc+e.exp)||1,Z={inc:0,exp:0,n:0},names=[...groups.map(g=>g.name),'Sin grupo'];
 const rowsH=names.map(nm=>{const e=a.find(x=>x.k===nm)||Z,gi=groups.findIndex(g=>g.name===nm),g=groups[gi];return`<tr><td><b>${esc(nm)}</b>${g?`<div class="mut">${g.terms.map(esc).join(', ')}</div>`:''}</td><td class="r">${e.n}</td><td class="r inc">${f(e.inc)}</td><td class="r exp">${f(e.exp)}</td><td class="r">${f(e.inc-e.exp)}</td><td class="r">${((e.inc+e.exp)/tot*100).toFixed(1)}%</td><td>${g?`<button class="s" onclick="act('del',${gi})">Eliminar</button>`:''}</td></tr>`}).join('');
 return`<h1>Grupos de conceptos</h1><div class="gap"><div class="card"><h3>Nuevo grupo</h3><div class="row"><input id="gn" placeholder="Nombre (p. ej. Cuotas)"><input id="gt" size="34" placeholder="Textos que contiene, separados por comas"><button class="pri" onclick="addG()">Crear grupo</button><button class="s" onclick="suggest()">Detectar conceptos similares</button></div></div>
 ${SUG.length?`<div class="card"><h3>Sugerencias</h3>${SUG[0].none?'<p class="mut">No hay sugerencias nuevas.</p>':SUG.map((s,i)=>`<div class="row" style="padding:4px 0"><b>${esc(s.name)}</b><span class="mut">${s.n} movimientos</span><button class="pri" onclick="act('acc',${i})">Aceptar</button><button class="s" onclick="act('rej',${i})">Rechazar</button></div>`).join('')}</div>`:''}
 <div class="card wrap"><table><thead><tr><th>Grupo</th><th class="r">Movimientos</th><th class="r">Ingresos</th><th class="r">Gastos</th><th class="r">Total</th><th class="r">%</th><th></th></tr></thead><tbody>${rowsH}</tbody></table></div></div>`}
const colL=i=>String.fromCharCode(65+i%26);
function impView(){let h='<h1>Importar Excel</h1>';
 h+=`<label class="drop" id="dz"><b>Arrastra aquí tu Excel</b><br><span class="mut">.xls o .xlsx</span><br><br><span class="pri">Seleccionar archivo</span><input class="sr" type="file" accept=".xls,.xlsx" onchange="readFile(this.files[0])"></label>`;
 if(imp.err)h+=`<div class="card exp">${esc(imp.err)}</div>`;
 if(imp.wb){const hd=rows[imp.hdr]||[],cols=Math.max(hd.length,...rows.slice(imp.hdr,imp.hdr+6).map(r=>r.length)),
  L={date:'Fecha',concept:'Concepto',vdate:'Fecha valor',amount:'Importe',balance:'Saldo'},
  sl=k=>`<label>${L[k]}<br><select onchange="imp.map.${k}=this.value===''?'':+this.value;render()"><option value="">— ninguna —</option>${Array.from({length:cols},(_,i)=>`<option value="${i}"${imp.map[k]===i?' selected':''}>${colL(i)} · ${esc(norm(hd[i]))}</option>`).join('')}</select></label>`,
  miss=[imp.map.date===''&&'la columna de fecha',imp.map.amount===''&&'la columna de importe'].filter(Boolean),
  pv=rows.slice(imp.hdr+1).filter(r=>r.some(c=>c!=='')).slice(0,6),ks=['date','concept','vdate','amount','balance'];
  h+=`<div class="card" style="margin-top:12px"><h3>${esc(imp.name)}</h3><div class="row"><label>Hoja<br><select onchange="imp.sheet=this.value;loadSheet();render()">${imp.wb.SheetNames.map(s=>`<option${s===imp.sheet?' selected':''}>${esc(s)}</option>`).join('')}</select></label><label>Fila de cabecera<br><input type="number" min="1" value="${imp.hdr+1}" style="width:80px" onchange="imp.hdr=Math.max(0,+this.value-1);autoMap();render()"></label>${ks.map(sl).join('')}</div>
  ${miss.length?`<p class="exp">Falta ${miss.join(' y ')}. Asígnala para poder importar.</p>`:''}
  <div class="wrap" style="margin-top:10px"><table><thead><tr>${ks.map(k=>`<th>${L[k]}</th>`).join('')}</tr></thead><tbody>${pv.map(r=>`<tr>${ks.map(k=>`<td>${imp.map[k]===''?'':esc(r[imp.map[k]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <p><button class="pri" onclick="build()" ${miss.length?'disabled':''}>Importar movimientos</button></p></div>`}
 if(imp.done){const d=imp.done;h+=`<div class="card" style="margin-top:12px"><h3 class="inc">${d.ok} movimientos importados correctamente</h3>${d.rev.length?`<p class="exp"><b>${d.rev.length} movimientos requieren revisión</b></p><ul class="mut">${d.rev.slice(0,20).map(r=>`<li>Fila ${r.row}: ${r.why} (${esc(r.txt.slice(0,80))})</li>`).join('')}</ul>`:''}<button class="pri" onclick="go('dash')">Ver dashboard</button></div>`}
 return h}
assign();render();
</script></body></html>
